name: Android App (APK + Play Store AAB)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Signing key (GitHub Secrets se)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build APK + AAB
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/VaidyaAshwaniTranslator.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            cp app/build/outputs/bundle/release/app-release.aab out/VaidyaAshwaniTranslator-playstore.aab
          fi
          ls -la out
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: VaidyaAshwaniTranslator-${{ env.VERSION_NAME }}
          path: out/*

      # Seedha download link (bina ZIP):
      # https://github.com/<owner>/<repo>/releases/latest/download/VaidyaAshwaniTranslator.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIGNED="Play Store signing key se signed ✅"
          [ -z "$KEYSTORE_BASE64" ] && SIGNED="⚠️ Test key se signed (Play Store ke liye signing secrets add karein)"
          printf '%s\n\n%s\n\n%s\n' \
            "📲 **Phone me install:** VaidyaAshwaniTranslator.apk download karke kholein → Install." \
            "🏪 **Play Store:** VaidyaAshwaniTranslator-playstore.aab ko Play Console me upload karein." \
            "$SIGNED" > notes.md
          gh release create "v$VERSION_NAME" out/* \
            --title "Vaidya Ashwani Live Call Translator v$VERSION_NAME" \
            --notes-file notes.md \
            --latest
